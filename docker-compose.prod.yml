services:
  db-prod:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splatoon
      POSTGRES_PASSWORD: splatoon
      POSTGRES_DB: splatoon
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splatoon -d splatoon"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Applies the migrations, then exits: the bot waits for it to succeed. Coolify would
  # count the exited container as unhealthy: exclude_from_hc leaves it out.
  migrate-prod:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command: ["-path", "/migrations", "-database", "postgres://splatoon:splatoon@db-prod:5432/splatoon?sslmode=disable", "up"]
    depends_on:
      db-prod:
        condition: service_healthy
    restart: "no"
    exclude_from_hc: true

  bot-prod:
    build: .
    environment:
      DATABASE_URL: postgres://splatoon:splatoon@db-prod:5432/splatoon?sslmode=disable
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      SUPPORT_URL: ${SUPPORT_URL:-https://revolut.me/adg01}
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "/bot", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db-prod:
        condition: service_healthy
      migrate-prod:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db_data_prod: {}
