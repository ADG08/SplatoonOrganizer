services:
  db-dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splatoon
      POSTGRES_PASSWORD: splatoon
      POSTGRES_DB: splatoon
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splatoon -d splatoon"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Applies the migrations, then exits: the bot waits for it to succeed.
  migrate-dev:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    depends_on:
      db-dev:
        condition: service_healthy
    restart: "no"

  bot-dev:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HEALTH_PORT: ${HEALTH_PORT:-8081}
    healthcheck:
      test: ["CMD", "/bot", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db-dev:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db_data_dev: {}
